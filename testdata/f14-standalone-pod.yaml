apiVersion: v1
kind: Pod
metadata:
  name: test-standalone
  namespace: default
  labels:
    feature: f14-test
spec:
  containers:
  - name: app
    image: nginx:alpine
    resources:
      requests:
        cpu: "50m"
        memory: "16Mi"
      limits:
        cpu: "100m"
        memory: "32Mi"
