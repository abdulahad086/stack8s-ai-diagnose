apiVersion: batch/v1
kind: Job
metadata:
  name: test-job
  namespace: default
  labels:
    feature: f14-test
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  template:
    metadata:
      labels:
        feature: f14-test
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: alpine:latest
        command: ["sh", "-c", "echo Feature14 Job test complete; sleep 2; exit 0"]
        resources:
          requests:
            cpu: "50m"
            memory: "16Mi"
          limits:
            cpu: "100m"
            memory: "32Mi"
