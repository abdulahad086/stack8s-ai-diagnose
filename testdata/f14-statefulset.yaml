apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: test-sts
  namespace: default
  labels:
    app: test-sts
    feature: f14-test
spec:
  serviceName: "test-sts-svc"
  replicas: 1
  selector:
    matchLabels:
      app: test-sts
  template:
    metadata:
      labels:
        app: test-sts
        feature: f14-test
    spec:
      containers:
      - name: app
        image: nginx:alpine
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
